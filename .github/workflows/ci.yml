name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install tesseract (scanned-page tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt && pip install --no-deps -e .
      - name: Lint
        run: ruff check
      - name: Types
        run: mypy
      - name: Config is valid
        run: recon check
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t recon .
      - name: Smoke test (CLI on the September sample, no LLM)
        run: >
          docker run --rm recon recon run --no-llm
          --pdf data/Supplier_Invoices_PT_Prima_Kertas_Sep2026.pdf
          --erp data/ERP_AP_Export_Sep2026.xlsx --out /tmp/out
